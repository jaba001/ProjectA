; Use only with -customconfig=SteamDev -ProjectASteamDev in a non-Shipping Windows game.
; 비 Shipping Windows 게임에서 -customconfig=SteamDev -ProjectASteamDev로만 사용합니다.
[OnlineSubsystem]
DefaultPlatformService=Steam

[OnlineSubsystemSteam]
bEnabled=true
SteamDevAppId=480
bInitServerOnClient=true
bUseSteamNetworking=false
bAllowP2PPacketRelay=true

; Preserve other drivers and fail instead of falling back to unauthenticated IP transport.
; 다른 드라이버는 유지하며 미인증 IP 전송으로 대체하지 않고 실패합니다.
[/Script/Engine.Engine]
-NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SteamSockets.SteamSocketsNetDriver",DriverClassNameFallback="/Script/SteamSockets.SteamSocketsNetDriver")

[PacketHandlerComponents]
+Components=OnlineSubsystemSteam.SteamAuthComponentModuleInterface
